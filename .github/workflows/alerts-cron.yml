name: Alerts cron

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call alerts endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 50 -H "Authorization: Bearer $CRON_SECRET" "https://www.wraith.farm/api/cron/tg-alerts"
